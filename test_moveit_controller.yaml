moveit_manage_controllers: false
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names:
  - r1_arm_controller
  - r2_arm_controller
  r1_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
    - r1_joint_1
    - r1_joint_2
    - r1_joint_3
    - r1_joint_4
    - r1_joint_5
    - r1_joint_6
  r2_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
    - r2_joint_1
    - r2_joint_2
    - r2_joint_3
    - r2_joint_4
    - r2_joint_5
    - r2_joint_6
