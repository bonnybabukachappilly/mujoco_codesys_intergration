name: ci

on:
  push:
  pull_request:

jobs:
  generator-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Run generator tests
        run: python -m pytest workspace/src/cell/cell_description/test -v

  build-and-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pytest python3-yaml
          rosdep init || true
          rosdep update --rosdistro humble
      - name: Install package dependencies
        run: |
          apt-get update
          rosdep install --from-paths workspace/src --ignore-src -y \
            --rosdistro humble --skip-keys mujoco_ros2_control
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          cd workspace
          colcon build --event-handlers console_direct+
          
      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          cd workspace
          source install/setup.bash
          colcon test --packages-select cell_description --event-handlers console_direct+
          colcon test-result --verbose