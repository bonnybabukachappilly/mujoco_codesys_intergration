controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints: [left_joint_1, left_joint_2, left_joint_3, left_joint_4, left_joint_5, left_joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      left_joint_1: {goal: 0.01}
      left_joint_2: {goal: 0.02}
      left_joint_3: {goal: 0.02}
      left_joint_4: {goal: 0.01}
      left_joint_5: {goal: 0.01}
      left_joint_6: {goal: 0.01}

right_arm_controller:
  ros__parameters:
    joints: [right_joint_1, right_joint_2, right_joint_3, right_joint_4, right_joint_5, right_joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      right_joint_1: {goal: 0.01}
      right_joint_2: {goal: 0.02}
      right_joint_3: {goal: 0.02}
      right_joint_4: {goal: 0.01}
      right_joint_5: {goal: 0.01}
      right_joint_6: {goal: 0.01}