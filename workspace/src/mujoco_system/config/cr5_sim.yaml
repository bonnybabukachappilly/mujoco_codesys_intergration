# Simulation-only tuning of the CR5 position servos in MuJoCo.
# Kinematics, inertia, limits, damping and friction come from the URDF.

geoms:
  visual_rgba: [0.85, 0.85, 0.88, 1]

servo_classes:
  heavy: {armature: 0.1,  kp: 8100, kv: 150}   # joints 1-3
  light: {armature: 0.02, kp: 500,  kv: 30}    # joints 4-6

joints:
  joint_1: {class: heavy}
  # TODO: kp 8600 is carried over from the first version and has no recorded
  # rationale. Prefer gravity compensation or document the reason.
  joint_2: {class: heavy, kp: 8600}
  joint_3: {class: heavy}
  joint_4: {class: light}
  joint_5: {class: light}
  joint_6: {class: light}
