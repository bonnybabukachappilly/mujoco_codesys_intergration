controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    r1_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    r1_gripper_controller:
      type: forward_command_controller/ForwardCommandController
    r2_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
r1_arm_controller:
  ros__parameters:
    joints:
    - r1_joint_1
    - r1_joint_2
    - r1_joint_3
    - r1_joint_4
    - r1_joint_5
    - r1_joint_6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
r1_gripper_controller:
  ros__parameters:
    joints:
    - r1_grip_slider_1
    interface_name: position
r2_arm_controller:
  ros__parameters:
    joints:
    - r2_joint_1
    - r2_joint_2
    - r2_joint_3
    - r2_joint_4
    - r2_joint_5
    - r2_joint_6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
