lift:
  controller_type: joint_trajectory_controller/JointTrajectoryController
  joints:
    - left_lift_slide
    - right_lift_slide

  parameters:
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.005
      goal_time: 1.0
      left_lift_slide:
        goal: 0.003
      right_lift_slide:
        goal: 0.003
    joints:
      - left_lift_slide
      - right_lift_slide
    open_loop_control: false
    gains:
      left_lift_slide:
        p: 1200.0
        i: 100.0
        d: 0.0
        i_clamp: 20.0
        ff_velocity_scale: 0.0
      right_lift_slide:
        p: 1200.0
        i: 100.0
        d: 0.0
        i_clamp: 20.0
        ff_velocity_scale: 0.0

plate:
  controller_type: joint_trajectory_controller/JointTrajectoryController
  parameters:
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      p1_plate_x:
        goal: 0.005
      p1_plate_y:
        goal: 0.005
    joints:
      - p1_plate_x
      - p1_plate_y
    open_loop_control: false
    gains:
      p1_plate_x:
        p: 250.0
        i: 25.0
        d: 50.0
        i_clamp: 24.5
        ff_velocity_scale: 0.0
      p1_plate_y:
        p: 250.0
        i: 25.0
        d: 50.0
        i_clamp: 24.5
        ff_velocity_scale: 0.0
