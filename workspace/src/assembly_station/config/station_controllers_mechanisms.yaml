# What the generator patch should ADD to station_controllers.yaml (effort + PID).
controller_manager:
  ros__parameters:
    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    p1_controller: # ASSUMPTION: one controller per plate
      type: joint_trajectory_controller/JointTrajectoryController

lift_controller:
  ros__parameters:
    joints: [left_lift_slide, right_lift_slide] # ASSUMPTION: both lifts move together
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    open_loop_control: false
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    # ASSUMPTION: gains sized for ~50 kg, wn = 10 rad/s. Re-size with tools/suggest_gains.py.
    gains:
      left_lift_slide:
        {
          p: 5000.0,
          i: 500.0,
          d: 900.0,
          i_clamp: 600.0,
          ff_velocity_scale: 0.0,
        }
      right_lift_slide:
        {
          p: 5000.0,
          i: 500.0,
          d: 900.0,
          i_clamp: 600.0,
          ff_velocity_scale: 0.0,
        }
    constraints:
      stopped_velocity_tolerance: 0.005
      goal_time: 1.0
      left_lift_slide: { trajectory: 0.02, goal: 0.003 }
      right_lift_slide: { trajectory: 0.02, goal: 0.003 }

p1_controller:
  ros__parameters:
    joints: [p1_plate_x, p1_plate_y] # p1_plate_z is state-only
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    open_loop_control: false
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    # From your old servo (kp 1000, kv 100) with m = 2 kg + 0.5 armature -> wn 20, zeta 1
    gains:
      p1_plate_x:
        { p: 1000.0, i: 50.0, d: 100.0, i_clamp: 100.0, ff_velocity_scale: 0.0 }
      p1_plate_y:
        { p: 1000.0, i: 50.0, d: 100.0, i_clamp: 100.0, ff_velocity_scale: 0.0 }
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      p1_plate_x: { trajectory: 0.05, goal: 0.005 }
      p1_plate_y: { trajectory: 0.05, goal: 0.005 }
