schema_version: 1
name: station

components:
  cr5:
    type: robot
    make: dobot
    descriptor: config/cr5.yaml
    package: dobot_description

  pgc_50_35:
    type: eoat
    make: pgc
    descriptor: config/pgc_50_35.yaml
    package: eoat_description

  base_top_vacuum:
    type: eoat
    make: custom
    descriptor: config/base_top_vacuum.yaml
    package: eoat_description

  # lift:
